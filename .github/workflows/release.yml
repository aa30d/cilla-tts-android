name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (for example v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$TAG" ]]; then
            echo "Tag must begin with v (example: v1.0.1)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/platforms" || true
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache patched libptts_ffi.so
        id: native-cache
        uses: actions/cache@v4
        with:
          path: native/.cache/jniLibs
          key: ptts-ffi-${{ runner.os }}-${{ hashFiles('native/xn-ptts.patch', 'native/build-ptts-ffi.sh') }}

      - name: Check the native patch applies to upstream
        shell: bash
        run: bash native/check-patch.sh

      - name: Build patched libptts_ffi.so (arm64-v8a, x86_64)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update || true
          rustup default stable || true
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK/ndk" ] || [ -z "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
            if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
            fi
          fi
          OUT_DIR="$PWD/native/.cache/jniLibs" bash native/build-ptts-ffi.sh

      - name: Install patched libptts_ffi.so
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          cp native/.cache/jniLibs/arm64-v8a/libptts_ffi.so app/src/main/jniLibs/arm64-v8a/libptts_ffi.so
          cp native/.cache/jniLibs/x86_64/libptts_ffi.so app/src/main/jniLibs/x86_64/libptts_ffi.so
          # The build script writes this next to the library; a cache hit skips that step.
          bash native/build-ptts-ffi.sh --symbols-only
          python3 native/check-ptts-ffi.py "$PWD"

      - name: Build release APK
        run: >-
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Generate checksum
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk
          sha256sum cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk > cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cilla TTS ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk
            cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk.sha256
