name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (for example v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - name: Set release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$TAG" ]]; then
            echo "Tag must begin with v (example: v1.0.1)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: >-
          gradle assembleRelease --no-daemon
          -PversionName=${{ steps.version.outputs.version }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Generate checksum
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk
          sha256sum cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk > cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cilla TTS ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk
            cilla-tts-${{ steps.version.outputs.version }}-unsigned.apk.sha256
