# TEMPORARY: builds the debug APK and commits it to the pushed branch so it can be fetched from
# an environment that cannot reach GitHub's artifact storage. Removed again after the download.
name: APK to branch (temporary)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish the debug APK to the branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build the debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Commit the APK to this branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .apk-out
          cp app/build/outputs/apk/debug/app-debug.apk .apk-out/cilla-tts-1.1.1-debug.apk
          ls -l .apk-out
          sha256sum .apk-out/cilla-tts-1.1.1-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .apk-out/cilla-tts-1.1.1-debug.apk
          git commit -m "ci: debug APK for download [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report the failure on the pull request
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Temporary APK build failed:'
            echo '```'
            grep -E "^e: |error:|FAILURE|^> Task .* FAILED|What went wrong" build.log | head -60 || true
            echo '```'
          } > comment.md
          gh pr comment 2 --body-file comment.md
